[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-solver"
version = "0.2.0"
description = "Decision-focused, simplified river NLHE poker solver with MCP adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24,<3", "uvicorn>=0.30,<1", "mcp==1.30.0", "PyJWT[crypto]>=2.10,<3"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
include = ["poker_spot*"]
