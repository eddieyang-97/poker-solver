services:
  - type: web
    name: poker-solver
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn poker_spot.http_server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: POKER_MODE
        value: hosted
    # Add the four OAuth settings in the dashboard after provider setup.
    # Until then /ready and /mcp return 503; /health only checks process liveness.
