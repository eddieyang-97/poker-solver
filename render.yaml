services:
  - type: web
    name: poker-solver
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn poker_spot.http_server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: POKER_MCP_TOKEN
        sync: false
      - key: POKER_ALLOWED_ORIGINS
        value: "https://chatgpt.com"
